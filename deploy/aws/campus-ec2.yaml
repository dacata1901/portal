AWSTemplateFormatVersion: '2010-09-09'
Description: Single-instance Campus event registration demo with persistent encrypted SQLite storage.

Parameters:
  ArtifactBucket:
    Type: String
    Description: Private S3 bucket containing the packaged application.
  ArtifactKey:
    Type: String
    Description: S3 object key for the application ZIP.
  AllowedCidr:
    Type: String
    Description: Public IPv4 CIDR allowed to access the demo HTTP port. Use your-address/32.
    AllowedPattern: ^(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}/(?:[0-9]|[12][0-9]|3[0-2])$
    ConstraintDescription: Specify an IPv4 CIDR such as 203.0.113.10/32.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
    Description: General-purpose x86 EC2 instance size.
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Canonical Ubuntu Server 24.04 LTS AMI for this region.
  AuthMode:
    Type: String
    Default: demo
    AllowedValues:
      - demo
      - cognito
    Description: Authentication mode (demo or cognito).
  DatabaseUrl:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional PostgreSQL connection string (leave empty for local SQLite on EBS).
  CognitoRegion:
    Type: String
    Default: ''
    Description: Optional Amazon Cognito region.
  CognitoUserPoolId:
    Type: String
    Default: ''
    Description: Optional Amazon Cognito User Pool ID.
  CognitoClientId:
    Type: String
    Default: ''
    Description: Optional Amazon Cognito App Client ID.
  CognitoDomain:
    Type: String
    Default: ''
    Description: Optional Amazon Cognito Hosted UI domain URL.
  CognitoRedirectUri:
    Type: String
    Default: ''
    Description: Optional Amazon Cognito callback URL.
  CognitoLogoutUri:
    Type: String
    Default: ''
    Description: Optional Amazon Cognito sign-out URL.
  ProvisionCognito:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Set to true to provision a Cognito User Pool, Domain, App Client, and role groups.
  ProvisionRds:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Set to true to provision an encrypted Amazon RDS PostgreSQL instance in the VPC.
  DbMasterPassword:
    Type: String
    Default: ''
    NoEcho: true
    Description: Master password for RDS PostgreSQL when ProvisionRds is true (min 8 chars).
  EnableCloudflareTunnel:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Run a Cloudflare Quick Tunnel (https://*.trycloudflare.com) in front of the app.
  OrganizerPassword:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional password (12-128 chars) for seeded account org-1 so organizers can sign in remotely.
  AdminPassword:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional password (12-128 chars) for seeded account admin-1 so administrators can sign in remotely.

Conditions:
  CreateCognitoResources: !Equals [!Ref ProvisionCognito, 'true']
  CreateRdsResources: !Equals [!Ref ProvisionRds, 'true']
  UseCloudflareTunnel: !Equals [!Ref EnableCloudflareTunnel, 'true']

Resources:
  PortalVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: campus-portal-vpc
  PortalSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref PortalVpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: campus-portal-public
  PortalInternetGateway:
    Type: AWS::EC2::InternetGateway
  PortalGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref PortalInternetGateway
      VpcId: !Ref PortalVpc
  PortalRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref PortalVpc
  PortalDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: PortalGatewayAttachment
    Properties:
      RouteTableId: !Ref PortalRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref PortalInternetGateway
  PortalSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PortalRouteTable
      SubnetId: !Ref PortalSubnet
  PortalSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref PortalVpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: campus-portal-secondary
  PortalSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PortalRouteTable
      SubnetId: !Ref PortalSubnetB
  PortalSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Restrict the Campus demo to the configured student IP range.
      VpcId: !Ref PortalVpc
      SecurityGroupIngress:
        - Description: Campus demo HTTP, restricted by AllowedCidr.
          IpProtocol: tcp
          FromPort: 4173
          ToPort: 4173
          CidrIp: !Ref AllowedCidr
      Tags:
        - Key: Name
          Value: campus-portal-web
  PortalInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadApplicationArchive
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ArtifactKey}
        - PolicyName: PublishTunnelUrl
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/tunnel-url
      Tags:
        - Key: Name
          Value: campus-portal-instance-role
  PortalInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref PortalInstanceRole
  PortalDataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      Encrypted: true
      Size: 8
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: campus-portal-sqlite-data
  PortalInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - PortalDefaultRoute
      - PortalGatewayAttachment
      - PortalSubnetRouteAssociation
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref PortalInstanceProfile
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          GroupSet:
            - !Ref PortalSecurityGroup
          SubnetId: !Ref PortalSubnet
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 10
            VolumeType: gp3
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -euxo pipefail
              exec > >(tee -a /var/log/campus-bootstrap.log) 2>&1

              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y curl python3 python3-venv unzip
              curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
              unzip -q /tmp/awscliv2.zip -d /tmp/awscli-inst
              /tmp/awscli-inst/aws/install
              rm -rf /tmp/awscliv2.zip /tmp/awscli-inst

              DATA_VOLUME_ID="${PortalDataVolume}"
              DATA_VOLUME_ID="$(echo "$DATA_VOLUME_ID" | tr -d '-')"
              DATA_DEVICE=""
              for attempt in $(seq 1 60); do
                for candidate in "/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$DATA_VOLUME_ID" /dev/xvdf /dev/sdf; do
                  if [ -b "$candidate" ]; then DATA_DEVICE="$candidate"; break 2; fi
                done
                sleep 2
              done
              test -n "$DATA_DEVICE"
              if ! blkid "$DATA_DEVICE"; then mkfs.ext4 -F "$DATA_DEVICE"; fi
              mkdir -p /var/lib/campus
              DATA_UUID="$(blkid -s UUID -o value "$DATA_DEVICE")"
              grep -q "$DATA_UUID" /etc/fstab || echo "UUID=$DATA_UUID /var/lib/campus ext4 defaults,nofail 0 2" >> /etc/fstab
              mount /var/lib/campus

              mkdir -p /opt/campus
              aws s3 cp "s3://${ArtifactBucket}/${ArtifactKey}" /tmp/campus-portal.zip --region ${AWS::Region}
              python3 -m zipfile -e /tmp/campus-portal.zip /opt/campus
              python3 -m venv /opt/campus/.venv
              if [ -f /opt/campus/requirements.txt ]; then
                /opt/campus/.venv/bin/pip install --no-cache-dir -r /opt/campus/requirements.txt
              fi
              chown -R ubuntu:ubuntu /opt/campus /var/lib/campus

              umask 077
              cat > /etc/campus-portal.env <<'CAMPUS_ENV'
              PORT=4173
              PORTAL_HOST=0.0.0.0
              PORTAL_DB=/var/lib/campus/portal.sqlite3
              PORTAL_OBJECT_DIR=/var/lib/campus/exports
              PORTAL_LOG_FILE=/var/lib/campus/requests.jsonl
              PORTAL_ALLOW_REMOTE_DEMO=1
              PORTAL_TRUST_LOCAL_PROXY=1
              PORTAL_AUTH_MODE=${AuthMode}
              PORTAL_DATABASE_URL=${ResolvedDatabaseUrl}
              COGNITO_REGION=${CognitoRegion}
              COGNITO_USER_POOL_ID=${CognitoUserPoolId}
              COGNITO_CLIENT_ID=${CognitoClientId}
              COGNITO_DOMAIN=${CognitoDomain}
              COGNITO_REDIRECT_URI=${CognitoRedirectUri}
              COGNITO_LOGOUT_URI=${CognitoLogoutUri}
              CAMPUS_ENV
              chmod 600 /etc/campus-portal.env
              umask 022

              cat > /etc/systemd/system/campus-portal.service <<'SERVICE'
              [Unit]
              Description=Campus University Event Registration Portal
              After=network-online.target
              Wants=network-online.target

              [Service]
              Type=simple
              User=ubuntu
              Group=ubuntu
              WorkingDirectory=/opt/campus
              EnvironmentFile=/etc/campus-portal.env
              ExecStart=/opt/campus/.venv/bin/python /opt/campus/server.py
              Restart=on-failure
              RestartSec=3

              [Install]
              WantedBy=multi-user.target
              SERVICE
              systemctl daemon-reload

              # Seed the database, then give seeded staff accounts passwords (never traced to logs).
              # /etc/campus-portal.env is root-only (chmod 600), so these steps run as root and hand ownership back.
              ( set -a; . /etc/campus-portal.env; set +a; cd /opt/campus; /opt/campus/.venv/bin/python server.py seed )
              set +x
              export CAMPUS_ORG_PW='${OrganizerPassword}'
              export CAMPUS_ADMIN_PW='${AdminPassword}'
              for pair in "org-1:CAMPUS_ORG_PW" "admin-1:CAMPUS_ADMIN_PW"; do
                uid="$(echo "$pair" | cut -d: -f1)"; var="$(echo "$pair" | cut -d: -f2)"
                if [ -n "$(printenv "$var")" ]; then
                  ( set -a; . /etc/campus-portal.env; set +a; cd /opt/campus; /opt/campus/.venv/bin/python scripts/set_account_password.py "$uid" --db "$PORTAL_DB" --password-env "$var" ) || echo "Could not set password for $uid"
                fi
              done
              unset CAMPUS_ORG_PW CAMPUS_ADMIN_PW
              set -x
              chown -R ubuntu:ubuntu /var/lib/campus
              systemctl enable --now campus-portal.service

              if [ "${EnableCloudflareTunnel}" = "true" ]; then
                curl -fsSL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb" -o /tmp/cloudflared.deb
                dpkg -i /tmp/cloudflared.deb
                rm -f /tmp/cloudflared.deb

                cat > /etc/systemd/system/campus-tunnel.service <<'TUNNEL'
              [Unit]
              Description=Cloudflare Quick Tunnel for Campus Portal
              After=network-online.target campus-portal.service
              Wants=network-online.target

              [Service]
              Type=simple
              User=ubuntu
              ExecStart=/usr/bin/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:4173
              Restart=always
              RestartSec=5

              [Install]
              WantedBy=multi-user.target
              TUNNEL

                cat > /usr/local/bin/campus-tunnel-url <<'WATCH'
              #!/bin/bash
              set -u
              last=""
              while true; do
                url="$(journalctl -u campus-tunnel --no-pager -o cat 2>/dev/null | grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' | grep -v '://api\.' | tail -n1)"
                if [ -n "$url" ] && [ "$url" != "$last" ]; then
                  echo "$url" > /var/lib/campus/tunnel-url.txt
                  aws ssm put-parameter --region ${AWS::Region} --name "/${AWS::StackName}/tunnel-url" --type String --overwrite --value "$url" && last="$url"
                fi
                sleep 10
              done
              WATCH
                chmod 755 /usr/local/bin/campus-tunnel-url

                cat > /etc/systemd/system/campus-tunnel-url.service <<'WATCHSVC'
              [Unit]
              Description=Publish the Campus Quick Tunnel URL to SSM Parameter Store
              After=campus-tunnel.service

              [Service]
              Type=simple
              ExecStart=/usr/local/bin/campus-tunnel-url
              Restart=always
              RestartSec=10

              [Install]
              WantedBy=multi-user.target
              WATCHSVC

                systemctl daemon-reload
                systemctl enable --now campus-tunnel.service campus-tunnel-url.service
              fi
            - ResolvedDatabaseUrl: !If
                - CreateRdsResources
                - !Sub 'postgresql://campus_admin:${DbMasterPassword}@${PortalPostgresInstance.Endpoint.Address}:${PortalPostgresInstance.Endpoint.Port}/campus?sslmode=require'
                - !Ref DatabaseUrl
      Tags:
        - Key: Name
          Value: campus-event-registration
        - Key: Project
          Value: university-event-registration-portal
  PortalDataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref PortalInstance
      VolumeId: !Ref PortalDataVolume
  CampusUserPool:
    Type: AWS::Cognito::UserPool
    Condition: CreateCognitoResources
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
  CampusUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: CreateCognitoResources
    Properties:
      Domain: !Sub campus-portal-${AWS::AccountId}-${AWS::StackName}
      UserPoolId: !Ref CampusUserPool
  CampusUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: CreateCognitoResources
    Properties:
      ClientName: !Sub ${AWS::StackName}-web
      UserPoolId: !Ref CampusUserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      CallbackURLs:
        - !Sub http://${PortalInstance.PublicIp}:4173/
        - http://127.0.0.1:4173/
      LogoutURLs:
        - !Sub http://${PortalInstance.PublicIp}:4173/
        - http://127.0.0.1:4173/
  CampusStudentsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateCognitoResources
    Properties:
      GroupName: Students
      UserPoolId: !Ref CampusUserPool
  CampusOrganizersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateCognitoResources
    Properties:
      GroupName: Organizers
      UserPoolId: !Ref CampusUserPool
  CampusAdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: CreateCognitoResources
    Properties:
      GroupName: Administrators
      UserPoolId: !Ref CampusUserPool
  PortalRdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateRdsResources
    Properties:
      GroupDescription: Allow PostgreSQL access from Campus Portal EC2 instances.
      VpcId: !Ref PortalVpc
      SecurityGroupIngress:
        - Description: PostgreSQL from PortalSecurityGroup
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref PortalSecurityGroup
      Tags:
        - Key: Name
          Value: campus-portal-rds-sg
  PortalDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: CreateRdsResources
    Properties:
      DBSubnetGroupDescription: DB subnet group for Campus Portal RDS PostgreSQL.
      SubnetIds:
        - !Ref PortalSubnet
        - !Ref PortalSubnetB
      Tags:
        - Key: Name
          Value: campus-portal-db-subnets
  PortalPostgresInstance:
    Type: AWS::RDS::DBInstance
    Condition: CreateRdsResources
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: postgres
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      DBName: campus
      MasterUsername: campus_admin
      MasterUserPassword: !Ref DbMasterPassword
      VPCSecurityGroups:
        - !Ref PortalRdsSecurityGroup
      DBSubnetGroupName: !Ref PortalDbSubnetGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      Tags:
        - Key: Name
          Value: campus-portal-postgres
  PortalHighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Campus Portal EC2 CPU utilization above 80% for two 5-minute periods.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref PortalInstance
  PortalStatusCheckAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Campus Portal EC2 instance or system status check failed.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref PortalInstance
  PortalCloudWatchDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-${AWS::Region}-dashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "EC2 CPU Utilization (%)",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/EC2", "CPUUtilization", "InstanceId", "${PortalInstance}" ]
                ],
                "period": 60,
                "stat": "Average"
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "EC2 Status Check & Network",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "AWS/EC2", "StatusCheckFailed", "InstanceId", "${PortalInstance}" ],
                  [ ".", "NetworkIn", ".", "." ],
                  [ ".", "NetworkOut", ".", "." ]
                ],
                "period": 60,
                "stat": "Sum"
              }
            }
          ]
        }

Outputs:
  ApplicationUrl:
    Description: Campus demo URL (only accessible from AllowedCidr).
    Value: !Sub http://${PortalInstance.PublicIp}:4173
  HealthCheckUrl:
    Description: Returns status ok after the application database is reachable.
    Value: !Sub http://${PortalInstance.PublicIp}:4173/healthz
  InstanceId:
    Description: EC2 instance ID.
    Value: !Ref PortalInstance
  DataVolumeId:
    Description: Encrypted EBS data volume ID. Deleting the stack also deletes this volume.
    Value: !Ref PortalDataVolume
  DashboardName:
    Description: CloudWatch monitoring dashboard name.
    Value: !Ref PortalCloudWatchDashboard
  TunnelUrlParameter:
    Condition: UseCloudflareTunnel
    Description: SSM parameter holding the public https://*.trycloudflare.com URL (updated if the tunnel restarts).
    Value: !Sub /${AWS::StackName}/tunnel-url
  CognitoUserPoolId:
    Condition: CreateCognitoResources
    Description: Provisioned Amazon Cognito User Pool ID.
    Value: !Ref CampusUserPool
  CognitoClientId:
    Condition: CreateCognitoResources
    Description: Provisioned Amazon Cognito App Client ID.
    Value: !Ref CampusUserPoolClient
  CognitoDomain:
    Condition: CreateCognitoResources
    Description: Provisioned Amazon Cognito Hosted UI domain.
    Value: !Sub https://${CampusUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  RdsEndpoint:
    Condition: CreateRdsResources
    Description: Provisioned Amazon RDS PostgreSQL endpoint address.
    Value: !GetAtt PortalPostgresInstance.Endpoint.Address
